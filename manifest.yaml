# ─────────────────────────────────────────────────────────────────────────────
# Your app's manifest. This file IS the app's contract.
#
# Everything Pippa shows a user about your app is generated from this file, and
# the runtime refuses anything you did not declare here. If `outcomes` does not
# list it, your app cannot be asked to do it. If `output` does not name a
# field, returning that field is an error, not a bonus.
#
# That strictness is the point. A user installing your app sees a permission
# screen built from this file, so the file has to be the truth.
# ─────────────────────────────────────────────────────────────────────────────

manifest_version: 1

# Your app keeps nothing between calls. This is not a preference you can
# change — every hackathon app runs with `persistence: none`, and the runtime
# throws away the machine your code ran on when it finishes.
persistence: none

# ── Your public author name ──────────────────────────────────────────────────
#
# It is the name everybody sees next to your app: on the install screen, in
# the list of apps and on every answer your app gives. So it is PUBLIC, and it
# is a pseudonym: a made-up name or a nickname, never a real name and never an
# email address. This repository is public too, so anyone can read it here.
#
# The rules: 3 to 30 characters; letters, numbers, spaces, dots, hyphens and
# underscores; starting with a letter or a number; nothing that looks like an
# email or a web address; and not "pippa", "official" or "verified". Another
# builder cannot use the same name, and you can use yours on all your apps.
#
# It does not decide who owns the app, and nothing in this file does. Pippa
# Labs created this repository for your Pippa account, so every app published
# from it is yours. docs/REVIEW_AND_SHARING.md is the whole story.
app_author_name: "poppynoteaming"

app:
  # It must be `hack.` + this repository's name with `pippa-hack-` removed and
  # every hyphen turned into an underscore:
  #
  #     Pippa-Labs/pippa-hack-app-8f6e-3  ->  hack.app_8f6e_3
  #
  # Hyphens are not valid in an app id anywhere. `git remote get-url origin`
  # tells you the repository name.
  id: hack.app_8f6e_3
  name: Clean Plate
  # Three numbers: 0.1.0, not 0.1 and not v0.1.0. Frozen once you press
  # Submit for review: bump it (0.1.0 -> 0.1.1) before the next push.
  version: 0.1.0
  # One or two sentences, written for someone deciding whether to install it.
  # Say what it does and what it sends anywhere. Never use the word "by" — the
  # badge Pippa shows is parsed from "[via <name> <version> by <author name>]"
  # (the author name is `app_author_name` above) and splits on the first "by".
  summary: >-
    Food hygiene rating and latest inspection date for a UK restaurant, cafe
    or takeaway, from the Food Standards Agency's public register. It sends
    the business name and the place you give to the FSA ratings API, and a
    postcode or area name to postcodes.io to find where that is; it keeps
    nothing.
agent_types:
  - personal

# ── Outcomes: the things your app can be asked to do ─────────────────────────
#
# An outcome is one job. Pippa picks between your outcomes — and between your
# app and every other app — by comparing the user's message against `summary`
# and `example_phrases`. So those two fields are not documentation; they are
# the behaviour that decides whether your app is used at all.
#
# Clean Plate has one job, so one outcome. Only the first four phrases reach
# the skill chooser, so those four cover both promises in the summary: the
# rating ("food hygiene rating", "clean", "hygiene score") and when it was
# inspected ("last inspected"). None uses a word another app owns (today,
# tomorrow, calendar, remind, remember, search, news ...).

outcomes:
  - id: hygiene.rating
    summary: >-
      Food hygiene rating (0 to 5, or Pass in Scotland) and last inspection
      date for a restaurant, cafe or takeaway
    example_phrases:
      - what's the food hygiene rating of
      - when was this restaurant last inspected
      - is this takeaway clean
      - hygiene score for
      - how many stars did this cafe get for hygiene
      - when did the inspectors last visit
      - scores on the doors for
      - fsa rating for the restaurant
      - has this place passed its hygiene inspection
    inputs:
      - name: business
        type: string
        required: true
        description: >-
          The name of the restaurant, cafe, takeaway, pub or food shop the
          person asked about, exactly as they wrote it, for example "Dishoom",
          "Bao", "Franco Manca" or "Pret". If they gave no name but described
          the place, return the description, for example "chicken shop". Leave
          the place words out: for "Dishoom King's Cross" return "Dishoom". If
          the message names or describes no business at all, return an empty
          string rather than guessing one.
      - name: place
        type: string
        required: false
        description: >-
          The area, street, town or postcode the person gave for the business,
          exactly as they wrote it, for example "King's Cross", "Soho",
          "Brixton", "Exhibition Road" or "SW7 2AZ". If the message gives no
          place, return an empty string. Never guess one, and never fill in
          "London" or wherever the person might be.
    output:
      - name: business_name
        type: string
        description: >-
          The business name as the Food Standards Agency lists it; empty when
          no matching listing was found.
      - name: address
        type: string
        description: >-
          The listed address lines, joined with commas; empty when no matching
          listing was found.
      - name: postcode
        type: string
        description: The listed postcode; empty when no matching listing was found.
      - name: rating
        type: string
        description: >-
          The food hygiene rating. "0" to "5" in England, Wales and Northern
          Ireland, where 5 is the best and 0 means urgent improvement is
          necessary. In Scotland "Pass" or "Improvement Required" (sometimes
          "Pass and Eat Safe"). Otherwise "Exempt", "Awaiting inspection" or
          "Awaiting publication". Empty when no matching listing was found.
      - name: rating_date
        type: string
        description: >-
          The date of the inspection the rating comes from, as YYYY-MM-DD;
          empty when it has never been inspected or no listing was found.
      - name: hygiene_score
        type: integer
        required: false
        description: >-
          The inspector's score for hygienic food handling. Lower is better:
          0 very good, 5 good, 10 generally satisfactory, 15 or more needs
          improvement (15 improvement necessary, 20 major improvement
          necessary, 25 or 30 urgent improvement necessary). Left out when
          there is no score, as in Scotland or before a first inspection.
      - name: structural_score
        type: integer
        required: false
        description: >-
          The inspector's score for the cleanliness and condition of the
          premises. Lower is better: 0 very good, 5 good, 10 generally
          satisfactory, 15 or more needs improvement. Left out when there is
          no score.
      - name: management_score
        type: integer
        required: false
        description: >-
          The inspector's confidence in how food safety is managed. Lower is
          better: 0 very good, 5 good, 10 generally satisfactory, 15 or more
          needs improvement. Left out when there is no score.
      - name: other_matches
        type: array
        item_type: string
        description: >-
          Up to three other listings that also matched the name, each as
          "Name, address, POSTCODE (rating R)", in case the answer is the
          wrong branch; empty when there were none.

# ── API keys ─────────────────────────────────────────────────────────────────
#
# Clean Plate needs none. Both services it calls are free and keyless:
#
#   - the Food Standards Agency's ratings API (api.ratings.food.gov.uk), for
#     the listings, ratings and inspection dates;
#   - postcodes.io (api.postcodes.io), to turn a postcode or area name into a
#     point on the map, so the FSA can be asked for listings near it.
#
# So there is no `app_secrets:` block. `connectors:` and `secrets:` are not
# used either (hackathon apps may not use them).
